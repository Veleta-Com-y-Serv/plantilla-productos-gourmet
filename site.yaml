colores:
  primario: "#4b5726"   # verde oliva: cabecera, bandas oscuras y botones secundarios
  acento: "#a4532d"     # tierra: botones, líneas de los antetítulos y bandas de color
  fondo: "#f3ebdb"      # crema
  texto: "#2b2519"
contacto:
  telefono: "927 32 18 46"
  email: hola@majadadelberrocal.es
  direccion: Calle de los Mesones 6, 10200 Trujillo (Cáceres)
  horario: Lunes a sábado de 10:00 a 14:00 y de 17:00 a 20:00. Domingos de 10:00 a 14:00.
  whatsapp: "+34 659 41 27 08"
redes:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  linkedin: ""
menu:
